name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Check documentation integrity
        run: npm run check:docs

      - name: Check React version compatibility
        run: npm run check:react-versions

      - name: Run Expo Doctor
        run: npx --yes expo-doctor

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage -- --runInBand

  native-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for native changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_TARGET="origin/${{ github.base_ref }}...HEAD"
            BASE_REF="origin/${{ github.base_ref }}"
          else
            DIFF_TARGET="HEAD~1...HEAD"
            BASE_REF="HEAD~1"
          fi
          echo "Comparing changes with: $DIFF_TARGET (base: $BASE_REF)"
          CHANGED_FILES=$(git diff --name-only "$DIFF_TARGET" 2>/dev/null || git diff --name-only HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # 1. Direct native configuration and lockfile changes
          STATIC_NATIVE_PATTERN='^(android/|package-lock\.json$|app\.json$|app\.config\..*|babel\.config\..*|metro\.config\..*|eas\.json$)'
          if echo "$CHANGED_FILES" | grep -E -q "$STATIC_NATIVE_PATTERN"; then
            echo "native_changed=true" >> "$GITHUB_OUTPUT"
            echo "Native-sensitive files detected. Native build will run."
            exit 0
          fi

          # 2. Inspect package.json if it was changed
          if echo "$CHANGED_FILES" | grep -q '^package\.json$'; then
            echo "package.json changed. Inspecting dependency changes..."
            HAS_NATIVE_DEP_CHANGE=$(node -e '
              const cp = require("child_process");
              const fs = require("fs");

              function isNativePackage(name, inDeps) {
                if (
                  name === "expo" ||
                  name.startsWith("expo-") ||
                  name.startsWith("@expo/") ||
                  name === "react" ||
                  name === "react-dom" ||
                  name === "react-native" ||
                  name === "react-native-web" ||
                  name.startsWith("react-native-") ||
                  name.startsWith("@react-native/") ||
                  name.startsWith("@react-native-community/") ||
                  name === "react-test-renderer" ||
                  name === "@types/react" ||
                  name === "llama.rn" ||
                  name.startsWith("@bam.tech/") ||
                  name === "jest-expo"
                ) {
                  return true;
                }
                const isPureJs = name === "piexifjs" || name.startsWith("@react-navigation/");
                return !isPureJs && inDeps;
              }

              let baseObj = {};
              try {
                const baseRaw = cp.execSync(`git show "${process.argv[1]}:package.json"`, { encoding: "utf8" });
                baseObj = JSON.parse(baseRaw);
              } catch (e) {
                console.error("Could not read base package.json, triggering build for safety:", e.message);
                process.stdout.write("true");
                process.exit(0);
              }

              let headObj = {};
              try {
                headObj = JSON.parse(fs.readFileSync("package.json", "utf8"));
              } catch (e) {
                console.error("Could not read head package.json, triggering build for safety:", e.message);
                process.stdout.write("true");
                process.exit(0);
              }

              const baseDeps = { ...(baseObj.dependencies || {}), ...(baseObj.devDependencies || {}) };
              const headDeps = { ...(headObj.dependencies || {}), ...(headObj.devDependencies || {}) };

              const changedKeys = new Set();
              for (const k of Object.keys(baseDeps)) {
                if (baseDeps[k] !== headDeps[k]) changedKeys.add(k);
              }
              for (const k of Object.keys(headDeps)) {
                if (baseDeps[k] !== headDeps[k]) changedKeys.add(k);
              }

              const nativeChanged = Array.from(changedKeys).filter(k => isNativePackage(k, k in (headObj.dependencies || {}) || k in (baseObj.dependencies || {})));
              if (nativeChanged.length > 0) {
                console.error("Native dependencies changed:", nativeChanged);
                process.stdout.write("true");
              } else {
                console.error("No native dependencies changed (changes are scripts, metadata, or pure JS tooling).");
                process.stdout.write("false");
              }
            ' "$BASE_REF")

            if [ "$HAS_NATIVE_DEP_CHANGE" = "true" ]; then
              echo "native_changed=true" >> "$GITHUB_OUTPUT"
              echo "Native dependency changes detected in package.json. Native build will run."
              exit 0
            fi
          fi

          echo "native_changed=false" >> "$GITHUB_OUTPUT"
          echo "No native-sensitive changes detected. Skipping native build."

      - name: Setup Java
        if: steps.filter.outputs.native_changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        if: steps.filter.outputs.native_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.native_changed == 'true'
        run: npm ci

      - name: Build Android Debug APK
        if: steps.filter.outputs.native_changed == 'true'
        run: npm run build:android:debug
